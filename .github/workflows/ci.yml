name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build-test:
    runs-on: ubuntu-26.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7
      - name: Compiler version
        run: $CXX --version
      - name: Configure
        run: cmake -S . -B build -DBITE_BUILD_TESTS=ON -DBITE_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "21"
          style: file
          tidy-checks: "-*"
          format-review: true
          passive-reviews: true

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
